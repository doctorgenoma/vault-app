name: Supabase Keep-Alive

# Ejecuta una consulta real a la base de datos cada 3 días
# para evitar que Supabase pause el proyecto por inactividad
# (el límite de Supabase es 7 días sin actividad de base de datos)

on:
  schedule:
    # Cada 3 días a las 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:   # Permite lanzarlo manualmente para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase (consulta real a la tabla vaults)
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "→ Consultando Supabase para mantener el proyecto activo..."

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/vaults?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON}" \
            -H "Authorization: Bearer ${SUPABASE_ANON}")

          echo "→ Código HTTP recibido: ${HTTP_CODE}"
          cat /tmp/response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Ping exitoso. Proyecto Supabase activo."
          else
            echo "⚠️ Respuesta inesperada (HTTP ${HTTP_CODE}). Revisa los secrets configurados."
            exit 1
          fi

      - name: Resumen
        run: echo "Keep-alive ejecutado el $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
